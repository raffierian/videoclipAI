name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*' # Trigger build ketika ada tag yang dimulai dengan v, contoh: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            yt_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
            yt_file: "yt-dlp.exe"
          - os: macos-latest
            yt_url: "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
            yt_file: "yt-dlp"

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"
        run: npm install

      - name: Manually download yt-dlp binary
        run: |
          mkdir -p node_modules/youtube-dl-exec/bin
          curl -L "${{ matrix.yt_url }}" -o "node_modules/youtube-dl-exec/bin/${{ matrix.yt_file }}"
        shell: bash

      - name: Set executable permission for yt-dlp (Mac)
        if: matrix.os == 'macos-latest'
        run: chmod +x "node_modules/youtube-dl-exec/bin/${{ matrix.yt_file }}"

      - name: Build and Publish App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npm run dist -- --publish always
